name: Setup Elixir
description: Install Erlang/Elixir from .tool-versions, restore the deps/_build cache and fetch deps

runs:
  using: composite
  steps:
    - uses: erlef/setup-beam@v1
      id: beam
      with:
        version-file: .tool-versions
        version-type: strict

    - name: Cache deps
      uses: actions/cache@v4
      with:
        path: |
          deps
          _build
        key: mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
        restore-keys: mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

    - run: mix deps.get
      shell: bash
