name: CI

on:
  pull_request:
  # Runs on main populate the dependency cache that pull requests restore from.
  push:
    branches: [main]

env:
  MIX_ENV: test

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-elixir
      - run: mix compile --warnings-as-errors
      - run: mix ash.codegen --check
      - run: mix deps.unlock --check-unused

  format:
    name: Format
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-elixir
      - run: mix format --check-formatted

  credo:
    name: Credo
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-elixir
      - run: mix credo --strict

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-elixir

      - name: Cache PLT
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix dialyzer --format github

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: compile

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-elixir
      - run: mix test
